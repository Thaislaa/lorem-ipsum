<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/contato.css">
    <link rel="stylesheet" href="css/base.css">
</head>

<body>
    <header>
        <div class="container menu">
            <a href="./index.html">
                <img src="../img/LOGO.png" alt="Logo Lorem Ipsum">
            </a>
            <nav>
                <ul>
                    <li>
                        <a href="./index.html">Home</a>
                    </li>
                    <li>
                        <a href="./sobre.html">Sobre Nós</a>
                    </li>
                    <li>
                        <a href="#servicos">Serviços</a>
                    </li>
                    <li>
                        <a href="./contato.html">Contato</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="banner">
            <div class="container div-contato">
                <h1>Contato</h1>
                <p>Olá, somos a Lorem Ipsum. <br>
                    Nosso trabalho é desenvolver textos de marcação.</p>
            </div>
        </section>

        <section class="forms container">
            <div class="title-forms">
                <h2>Envie-nos uma mensagem</h2>
                <img src="/img/ENVELOP.svg" alt="Ícone de mensagem">
            </div>

            <form action="#">
                <div class="div-formulario">
                    <div class="conteudo-form margin-right-form">
                        <label for="nome" class="label-text">Nome</label>
                        <input name="nome" id="nome" type="text" placeholder="Ex.: José Maria da Silva" required>
                    </div>

                    <div class="conteudo-form">
                        <label for="email" class="label-text">E-mail</label>
                        <input name="email" id="email" type="email" placeholder="Ex.: seuemail@email.com" required>
                    </div>
                </div>

                <div class="div-formulario">
                    <div class="conteudo-form margin-right-form">
                        <label for="ramo" class="label-text">Ramo em que atua</label>
                        <select name="ramo" id="ramo" required>
                            <option value="">Selecione...</option>
                            <option value="tecnologia">Tecnologia</option>
                            <option value="educacao">Educação</option>
                            <option value="saude">Saúde</option>
                            <option value="comercio">Comércio</option>
                            <option value="industria">Indústria</option>
                            <option value="servicos">Serviços</option>
                            <option value="administracao">Administração</option>
                            <option value="financas">Finanças</option>
                            <option value="marketing">Marketing</option>
                            <option value="engenharia">Engenharia</option>
                            <option value="construcao">Construção Civil</option>
                            <option value="agropecuaria">Agropecuária</option>
                            <option value="transportes">Transportes e Logística</option>
                            <option value="alimentacao">Alimentação</option>
                            <option value="turismo">Turismo e Hotelaria</option>
                            <option value="comunicacao">Comunicação</option>
                            <option value="juridico">Jurídico</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div class="conteudo-form">
                        <label for="assunto" class="label-text">Assunto</label required>

                        <div class="div-radio">
                            <div>
                                <input type="radio" name="assunto" id="investimento" value="investimento" required>
                                <label for="investimento">Investimento</label>
                            </div>

                            <div>
                                <input type="radio" name="assunto" id="contratacao" value="contratacao">
                                <label for="contratacao">Contratação</label>
                            </div>
                        </div>
                    </div>
                </div>

                <label for="mensagem" class="label-text">Mensagem</label>
                <textarea name="mensagem" id="mensagem" placeholder="Digite sua mensagem aqui" required></textarea>

                <div class="div-formulario display-flex">
                    <div class="conteudo-form check margin-right-form">
                        <input type="checkbox" name="termos" id="termos" value="sim" required>
                        <label for="termos">Li e concordo com a política de privacidade</label>
                    </div>

                    <div class="conteudo-form">
                        <button type="submit">ENVIAR <img src="../img/mais.svg" alt="Ícone Mais"></button>
                    </div>
                </div>
            </form>
        </section>
    </main>

</body>

</html>
